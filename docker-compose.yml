services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage}
      POSTGRES_DB: ${POSTGRES_DB:-stage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stage} -d ${POSTGRES_DB:-stage}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage}
      POSTGRES_DB: ${POSTGRES_DB:-stage}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Direct API access; host side overridable via API_PORT.
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      # Browser UI; host side overridable via WEB_PORT.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # One-off acceptance service:
  #   docker compose --profile verify run --rm verify
  # Runs real pytest (transaction races, expiry boundary) against the same
  # PostgreSQL, then Playwright dual-browser handover against web+api.
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: verify/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-stage}:${POSTGRES_PASSWORD:-stage}@db:5432/${POSTGRES_DB:-stage}
      BASE_URL: http://web
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      web:
        condition: service_started
    # Chromium needs a decent /dev/shm for two concurrent browser contexts.
    shm_size: "1gb"

volumes:
  pgdata:
